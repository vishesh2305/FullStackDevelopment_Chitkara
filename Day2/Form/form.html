<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Form</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>

    <form action="#" class="form">

        <div class="form-el-container"><label for="FName" class="form-labels">First Name : </label>
            <input type="text" class="form-inputs" placeholder="First Name">
            <br>
        </div>

        <div class="form-el-container"><label for="LName" class="form-labels">Last Name : </label>
            <input type="text" class="form-inputs" placeholder="Last Name">
            <br>
        </div>

        <div class="form-el-container"><label for="Email" class="form-labels">Email : </label>
            <input type="email" class="form-inputs" name="email" placeholder="example@gmail.com">
            <br>
        </div>

        <div class="form-el-container"><label for="Phonenumber" class="form-labels">Phone Number : </label>
            <input type="tel" name="phone" class="form-inputs" placeholder="123-4567-890">
            <br>
        </div>

        <div class="form-el-container"> <label for="dob" class="form-labels">DOB : </label>
            <input type="date" class="form-inputs" placeholder="DOB">
        </div>



    </form>

</body>

</html>
